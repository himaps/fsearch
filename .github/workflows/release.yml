name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-deb:
    name: Build ${{ matrix.arch }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64: bookworm (glibc 2.36, ICU 72) for UOS ARM64 devices
          - arch: arm64
            runner: ubuntu-24.04-arm
            multiarch: aarch64-linux-gnu
            container: debian:bookworm-slim
            wnck_from_source: true
          # amd64: focal (glibc 2.31, ICU 66) so the binary runs on Kylin V10 /
          # Ubuntu 20.04 era x86_64 systems; focal still ships libwnck-3-dev
          - arch: amd64
            runner: ubuntu-24.04
            multiarch: x86_64-linux-gnu
            container: ubuntu:20.04
            wnck_from_source: false
    # Native runners produce native builds, no cross compilation needed
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      # The bookworm-slim container's pkg-config does not search the multiarch
      # pkgconfig directory on its own
      PKG_CONFIG_PATH: /usr/lib/${{ matrix.multiarch }}/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
      # prevent tzdata & co from hanging apt on interactive prompts
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install build dependencies
        run: |
          set -e
          for attempt in 1 2 3 4; do
            if apt-get update; then
              break
            fi
            echo "apt-get update failed (attempt $attempt), retrying in 20s" >&2
            if [ "$attempt" = "4" ]; then
              exit 1
            fi
            sleep 20
          done
          apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            build-essential meson ninja-build pkg-config git curl ca-certificates \
            appstream intltool libtool itstool libxml2-utils \
            libglib2.0-dev libgtk-3-dev libpcre2-dev libicu-dev \
            libstartup-notification0-dev libxres-dev \
            ${{ matrix.wnck_from_source == false && 'libwnck-3-dev' || '' }}

      - name: Build libwnck-3 from source
        if: matrix.wnck_from_source
        run: |
          set -e
          # libwnck-3 was removed from Debian bookworm, but UOS/deepin ships it
          # and it powers the file manager window switcher feature
          git clone --depth 1 --branch 43.0 https://gitlab.gnome.org/GNOME/libwnck.git /tmp/libwnck
          meson setup /tmp/libwnck/build /tmp/libwnck --prefix=/usr -Dgtk_doc=false -Dintrospection=disabled
          ninja -C /tmp/libwnck/build
          ninja -C /tmp/libwnck/build install
          ldconfig
          pkg-config --modversion libwnck-3.0 || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure version name
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            # safe.directory: after actions/checkout the repo dir is owned by a
            # different uid in the container, which makes plain git calls fail.
            # The checkout is fetched with --no-tags, so describe yields the
            # short hash; prefix a date so the deb version starts with a digit.
            VERSION="$(git -c safe.directory='*' describe --tags --always 2>/dev/null | sed 's/^v//' || true)"
            VERSION="$(date +%Y%m%d)-${VERSION}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(date +%Y%m%d)-manual"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION} for ${{ matrix.arch }}"

      - name: Build
        run: |
          meson setup build --prefix=/usr -Dwnck=enabled
          ninja -C build

      - name: Run tests
        run: ninja -C build test

      - name: Stage install tree
        run: |
          DESTDIR="$PWD/staging" ninja -C build install

      - name: Build deb package
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PKGDIR="pkg/fsearch_${VERSION}_${ARCH}"
          mkdir -p "${PKGDIR}/DEBIAN"
          cp -a staging/. "${PKGDIR}/"
          cat > "${PKGDIR}/DEBIAN/control" <<EOF
          Package: fsearch
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: FSearch UOS customization
          Section: utils
          Priority: optional
          Description: A fast file search utility (UOS ${ARCH} build)
           GTK3 based file search utility with UOS desktop integrations:
           hotkey window toggle and file manager window switching.
           Built without strict Depends; install with "dpkg -i".
          EOF
          dpkg-deb --build --root-owner-group "${PKGDIR}"

      - name: Build binary tarball
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          tar -C staging -czf "fsearch_${VERSION}_${{ matrix.arch }}.tar.gz" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fsearch-${{ matrix.arch }}-${{ steps.ver.outputs.version }}
          path: |
            pkg/*.deb
            *.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cat > release_notes.md <<'EOF'
          FSearch UOS custom build, based on upstream 0.3.x.

          - Toggle window visibility with a global hotkey (bind `fsearch` in the control center)
          - Switch back to the last used file manager window (`fsearch --switch-file-manager`)
          - Batch rename for selected search results (F2): regex, counter, ignore extension, presets
          - Striped result rows with configurable background and text colors
          - Instant result list refresh after renames

          Assets: arm64 for UOS ARM64 devices, amd64 for x86_64 (VM) testing.
          Install: `sudo dpkg -i fsearch_*.deb` (no strict Depends, see README_UOS.md)
          EOF
          NOTES_JSON=$(sed 's/\\/\\\\/g; s/"/\\"/g' release_notes.md | awk 'BEGIN{ORS=""} {print $0 "\\n"}')

          API="https://api.github.com/repos/${REPO}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"

          RELEASE_ID=$(curl -sf -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "$API/releases" \
            -d "{\"tag_name\":\"${TAG_NAME}\",\"name\":\"FSearch ${TAG_NAME#v} (UOS)\",\"target_commitish\":\"master\",\"body\":\"${NOTES_JSON}\"}" \
            | grep -o '"id": *[0-9]*' | head -1 | grep -oE '[0-9]+')

          if [ -z "$RELEASE_ID" ]; then
            # release for this tag already exists: reuse it
            RELEASE_ID=$(curl -sf -H "$AUTH" -H "Accept: application/vnd.github+json" \
              "$API/releases/tags/${TAG_NAME}" | grep -o '"id": *[0-9]*' | head -1 | grep -oE '[0-9]+')
          fi
          test -n "$RELEASE_ID"

          for ASSET in $(find assets -type f); do
            curl -sf -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
              --data-binary @"$ASSET" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=$(basename "$ASSET")" > /dev/null \
              || echo "failed to upload $(basename "$ASSET")"
            echo "uploaded asset: $(basename "$ASSET")"
          done
