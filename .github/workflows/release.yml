name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-deb:
    name: Build ${{ matrix.arch }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            multiarch: aarch64-linux-gnu
          - arch: amd64
            runner: ubuntu-24.04
            multiarch: x86_64-linux-gnu
    # Native runners produce native builds, no cross compilation needed.
    # bullseye (glibc 2.31) matches Kylin V10 / UbuntuKylin 20.04 hosts exactly
    # and stays close to UOS 20 devices; it still ships libwnck-3-dev, so no
    # source build of libwnck is required.
    runs-on: ${{ matrix.runner }}
    container: debian:bullseye-slim
    env:
      # The container's pkg-config does not search the multiarch pkgconfig
      # directory on its own
      PKG_CONFIG_PATH: /usr/lib/${{ matrix.multiarch }}/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
      # prevent tzdata & co from hanging apt on interactive prompts
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install build dependencies
        run: |
          set -e
          # bullseye is past its LTS end: the security suite's package files
          # were moved to the archive while its index still lingers on
          # deb.debian.org (apt update succeeds, installs 404). Point only the
          # security suite at archive.debian.org and keep main on the fast path.
          sed -i 's|http://deb.debian.org/debian-security|http://archive.debian.org/debian-security|g' /etc/apt/sources.list || true
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            sed -i 's|http://deb.debian.org/debian-security|http://archive.debian.org/debian-security|g' /etc/apt/sources.list.d/debian.sources
          fi
          for attempt in 1 2 3 4; do
            if apt-get -o Acquire::Check-Valid-Until=false update; then
              break
            fi
            echo "apt-get update failed (attempt $attempt), retrying in 20s" >&2
            if [ "$attempt" = "4" ]; then
              exit 1
            fi
            sleep 20
          done
          for attempt in 1 2 3 4 5; do
            if apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
              build-essential meson ninja-build pkg-config git curl ca-certificates \
              patchelf intltool libtool itstool libxml2-utils \
              libglib2.0-dev libgtk-3-dev libpcre2-dev libicu-dev \
              libstartup-notification0-dev libxres-dev libwnck-3-dev; then
              break
            fi
            echo "apt-get install failed (attempt $attempt), retrying in 45s" >&2
            if [ "$attempt" = "5" ]; then
              exit 1
            fi
            sleep 45
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure version name
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            # describe may yield nothing on old container gits (no tags fetched,
            # unknown safe.directory); the date alone is a valid dpkg version
            GITVER="$(git -c safe.directory='*' describe --tags --always 2>/dev/null | sed 's/^v//' || true)"
            VERSION="$(date +%Y%m%d)${GITVER:+-${GITVER}}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(date +%Y%m%d)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION} for ${{ matrix.arch }}"

      - name: Build
        run: |
          meson setup build --prefix=/usr -Dwnck=enabled
          ninja -C build

      - name: Run tests
        # bullseye's appstream is too old for the upstream metainfo validation,
        # so the unit tests are run by name instead of "ninja test"
        run: |
          meson test -C build \
            test_array test_database test_database_chunked_array \
            test_database_entry test_database_exclude test_database_file \
            test_database_include test_database_index_store test_query \
            test_rename test_size_utils test_string_utils test_time_utils

      - name: Stage install tree
        run: |
          DESTDIR="$PWD/staging" ninja -C build install

      - name: Bundle ICU and set RPATH
        run: |
          set -e
          # ICU breaks ABI between major versions (UOS ships 63, UbuntuKylin 66,
          # bullseye 67), so the build's libicuuc/libicudata travel inside the
          # package and the binary prefers them via RPATH. Everything else
          # (gtk/glib/wnck) is stable across the target systems.
          MULTIARCH="${{ matrix.multiarch }}"
          BUNDLE="staging/usr/lib/fsearch"
          mkdir -p "$BUNDLE"
          cp -a /usr/lib/$MULTIARCH/libicuuc.so.* "$BUNDLE"/
          cp -a /usr/lib/$MULTIARCH/libicudata.so.* "$BUNDLE"/
          patchelf --set-rpath /usr/lib/fsearch:/usr/lib/$MULTIARCH:/usr/lib staging/usr/bin/fsearch
          echo "bundled:" && ls -la "$BUNDLE"
          echo "rpath:" && patchelf --print-rpath staging/usr/bin/fsearch

      - name: Report required glibc version
        run: |
          MAX_GLIBC=$(objdump -T staging/usr/bin/fsearch | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "binary requires at most: ${MAX_GLIBC}"

      - name: Build deb package
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PKGDIR="pkg/fsearch_${VERSION}_${ARCH}"
          mkdir -p "${PKGDIR}/DEBIAN"
          cp -a staging/. "${PKGDIR}/"
          cat > "${PKGDIR}/DEBIAN/control" <<EOF
          Package: fsearch
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: FSearch UOS customization
          Section: utils
          Priority: optional
          Description: A fast file search utility (UOS ${ARCH} build)
           GTK3 based file search utility with UOS desktop integrations.
           Built on Debian bullseye (glibc 2.31) with bundled ICU, so it runs
           regardless of the system's ICU version. Install with "dpkg -i".
          EOF
          dpkg-deb --build --root-owner-group "${PKGDIR}"

      - name: Build binary tarball
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          tar -C staging -czf "fsearch_${VERSION}_${{ matrix.arch }}.tar.gz" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fsearch-${{ matrix.arch }}-${{ steps.ver.outputs.version }}
          path: |
            pkg/*.deb
            *.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-deb
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cat > release_notes.md <<'EOF'
          FSearch UOS custom build, based on upstream 0.3.x.

          - Toggle window visibility with a global hotkey (bind `fsearch` in the control center)
          - Switch back to the last used file manager window (`fsearch --switch-file-manager`)
          - Batch rename for selected search results (F2): regex, counter, ignore extension, presets
          - Striped result rows with configurable background and text colors
          - Instant result list refresh after renames

          Built on Debian bullseye (glibc 2.31) with bundled ICU: runs on
          Kylin V10 / UbuntuKylin 20.04 and UOS 20 regardless of the system's
          ICU version. Assets: arm64 for UOS ARM64 devices, amd64 for
          x86_64 (VM) testing. Install: `sudo dpkg -i fsearch_*.deb`
          EOF
          NOTES_JSON=$(sed 's/\\/\\\\/g; s/"/\\"/g' release_notes.md | awk 'BEGIN{ORS=""} {print $0 "\\n"}')

          API="https://api.github.com/repos/${REPO}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"

          RELEASE_ID=$(curl -sf -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "$API/releases" \
            -d "{\"tag_name\":\"${TAG_NAME}\",\"name\":\"FSearch ${TAG_NAME#v} (UOS)\",\"target_commitish\":\"master\",\"body\":\"${NOTES_JSON}\"}" \
            | grep -o '"id": *[0-9]*' | head -1 | grep -oE '[0-9]+')

          if [ -z "$RELEASE_ID" ]; then
            # release for this tag already exists: reuse it
            RELEASE_ID=$(curl -sf -H "$AUTH" -H "Accept: application/vnd.github+json" \
              "$API/releases/tags/${TAG_NAME}" | grep -o '"id": *[0-9]*' | head -1 | grep -oE '[0-9]+')
          fi
          test -n "$RELEASE_ID"

          for ASSET in $(find assets -type f); do
            curl -sf -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
              --data-binary @"$ASSET" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=$(basename "$ASSET")" > /dev/null \
              || echo "failed to upload $(basename "$ASSET")"
            echo "uploaded asset: $(basename "$ASSET")"
          done
